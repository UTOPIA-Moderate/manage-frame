spring:
  config:
    import:
  - optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  application:
    name: manage-gateway
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_HOST:localhost}:8848
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
        refresh-enabled: true
        shared-configs:
          - data-id: manage-log.yml
            group: ${NACOS_GROUP:DEFAULT_GROUP}
            refresh: true
          - data-id: manage-biz.yml
            group: ${NACOS_GROUP:DEFAULT_GROUP}
            refresh: true
      discovery:
        server-addr: ${NACOS_HOST:localhost}:8848
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: manage-auth
          uri: lb://manage-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: manage-system
          uri: lb://manage-system
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=1
        - id: manage-job
          uri: lb://manage-job
          predicates:
            - Path=/api/job/**
          filters:
            - StripPrefix=1
        - id: manage-file
          uri: lb://manage-file
          predicates:
            - Path=/api/file/**
          filters:
            - StripPrefix=1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
